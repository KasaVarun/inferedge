name: CI

on:
  push:
    branches: [main]
  pull_request:

# clang-format must match the version used to format the repository.
# ORT_DISABLE_TELEMETRY must be set before the ONNX Runtime library initializes.
env:
  CLANG_FORMAT_VERSION: "23.1.3"
  ORT_DISABLE_TELEMETRY: "1"

jobs:
  linux:
    name: Linux configure, build, test, format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the compiler, CMake, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-pip python3-venv
          cmake --version
          g++ --version
          python3 -m pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # Configure downloads the pinned Linux x86-64 CPU archive and checks its SHA-256.
      # CUDA and other GPU archives are not requested.
      - name: Check the project configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build the executable and tests
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python benchmark tooling tests
        run: python3 -m unittest benchmarks.test_collect_baseline benchmarks.test_analyze_baseline benchmarks.test_collect_concurrent benchmarks.test_analyze_concurrent benchmarks.test_collect_scheduler benchmarks.test_analyze_scheduler benchmarks.test_collect_overhead benchmarks.test_analyze_overhead benchmarks.test_collect_neural_scheduler benchmarks.test_analyze_neural_scheduler

      # models/requirements.txt pins onnx==1.22.0 for generators and fixture checks.
      # A throwaway venv keeps that pin off the system interpreter used above.
      - name: Run dynamic neural workload Python tests
        run: |
          python3 -m venv "${RUNNER_TEMP}/inferedge-onnx"
          "${RUNNER_TEMP}/inferedge-onnx/bin/python" -m pip install -r models/requirements.txt
          "${RUNNER_TEMP}/inferedge-onnx/bin/python" -c "import onnx; assert onnx.__version__ == '1.22.0', onnx.__version__"
          "${RUNNER_TEMP}/inferedge-onnx/bin/python" -m unittest models.test_dynamic_workloads

      - name: Check formatting
        run: |
          clang-format --version
          find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
