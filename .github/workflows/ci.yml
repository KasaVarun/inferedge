name: CI

on:
  push:
    branches: [main]
  pull_request:

# clang-format must match the version used to format the repository.
env:
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  linux:
    name: Linux configure, build, test, format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the compiler, CMake, and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-pip python3-venv
          cmake --version
          g++ --version
          python3 -m pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check the project configuration
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build the executable and tests
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check formatting
        run: |
          clang-format --version
          find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
